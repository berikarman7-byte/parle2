<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carnet de Mots — Learn French Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<button id="themeToggle" class="theme-toggle" aria-label="Toggle dark mode">
  <span class="theme-icon-light">☀</span><span class="theme-icon-dark">☾</span>
</button>

<div class="wrap">

  <!-- HOME: category picker + overall stats -->
  <div id="homeView">
    <header>
      <p class="eyebrow">Carnet de mots</p>
      <h1>Learn French vocabulary</h1>
      <p class="sub">Pick a category to start. Flip each card, mark what you know, and your progress is saved right here on this device.</p>
    </header>

    <div class="global-stats">
      <div class="gstat"><span class="n" id="totalKnown">0</span><span class="l">words known</span></div>
      <div class="gstat"><span class="n" id="totalWords">0</span><span class="l">total words</span></div>
      <div class="gstat"><span class="n" id="streakDays">0</span><span class="l">day streak</span></div>
    </div>

    <div class="category-grid" id="categoryGrid"></div>
  </div>

  <!-- DECK: the flashcards themselves -->
  <div id="deckView" style="display:none;">
    <div class="deck-header">
      <button id="btnBack" class="back-btn">&larr; All categories</button>
      <span class="deck-title" id="deckTitle"></span>
    </div>

    <div class="progress">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-meta">
        <span id="posLabel"></span>
        <span class="progress-stats"><span class="stat-known" id="statKnownInline">0</span> known · <span class="stat-review" id="statReviewInline">0</span> to review</span>
      </div>
    </div>

    <div class="stage">
      <div class="card" id="card">
        <div class="face front">
          <p class="word" id="wordFr"></p>
          <span class="flip-hint">tap the card to flip</span>
        </div>
        <div class="face back">
          <p class="translation" id="wordEn"></p>
        </div>
      </div>
    </div>

    <div class="actions">
      <button class="action review" id="btnReview">Don't know yet</button>
      <button class="action known" id="btnKnown">Know it</button>
    </div>

    <div class="toolbar">
      <button id="btnShuffle">Shuffle deck</button>
    </div>
  </div>

  <!-- SUMMARY: end of deck -->
  <div id="summaryView" class="summary" style="display:none;">
    <h2>Deck complete</h2>
    <p id="summarySub"></p>
    <div class="stat-row">
      <div class="stat"><span class="n" id="statKnown">0</span><span class="l">know it</span></div>
      <div class="stat"><span class="n" id="statReview">0</span><span class="l">to review</span></div>
    </div>
    <div class="summary-actions">
      <button class="action review" id="btnReviewMissed">Review missed words</button>
      <button class="action known" id="btnRestart">Start over</button>
    </div>
    <button id="btnHome" class="back-btn summary-home">&larr; All categories</button>
  </div>

</div>

<script src="words.js"></script>
<script src="script.js"></script>
</body>
</html>
